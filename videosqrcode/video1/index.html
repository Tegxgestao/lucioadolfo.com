<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Estas paginas nao podem ser encontradas por busca: o acesso e pelo QR do livro -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Agradecimento — Lúcio Adolfo</title>
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg?v=24">
<link rel="apple-touch-icon" href="/img/icone-app.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141311; --surface:#1c1a17; --line:#2e2a24;
    --text:#ece7dc; --muted:#a59d8e; --gold:#c2a05f; --gold-claro:#d9bd82;
    --serif:"Playfair Display",Georgia,serif;
    --sans:"Inter",system-ui,"Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--sans); line-height:1.7;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:2rem 1rem;
  }
  .wrap{width:100%; max-width:900px; text-align:center}

  /* ===== Assinatura no topo ===== */
  .marca{margin-bottom:3.25rem}
  .marca .nome{
    display:block;
    font-family:var(--serif); font-weight:500;
    font-size:clamp(1.85rem,6vw,2.9rem);
    letter-spacing:.06em; line-height:1.1;
    color:var(--text);
  }
  .marca .nome b{
    font-weight:600;
    background:linear-gradient(180deg,var(--gold-claro),var(--gold));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:var(--gold);
  }
  /* filete dourado que fecha a assinatura */
  .marca .regua{
    display:block; width:120px; height:1px; margin:1.1rem auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .marca .oab{
    display:block; margin-top:.85rem;
    font-size:.68rem; letter-spacing:.34em; text-transform:uppercase;
    color:var(--muted);
  }
  /* ===== Player ===== */
  .player{
    width:100%; aspect-ratio:16/9; background:#000;
    border:1px solid var(--line); display:block;
  }

  h1{
    font-family:var(--serif); font-weight:600; line-height:1.2;
    font-size:clamp(1.25rem,4vw,1.9rem); margin:1.75rem 0 .4rem;
  }
  .capitulo{
    font-size:.78rem; letter-spacing:.24em; text-transform:uppercase;
    color:var(--gold); margin-bottom:.2rem;
  }
  .btn{
    display:inline-flex; align-items:center; gap:.55rem;
    padding:.85rem 1.6rem; border:1px solid var(--gold); color:var(--gold);
    letter-spacing:.06em; font-size:.95rem; text-decoration:none;
    margin-top:1.9rem; transition:all .2s;
  }
  .btn:hover,.btn:focus{background:var(--gold); color:#181614}

  @media (max-width:620px){
    body{padding:1.25rem .75rem}
    .marca{margin-bottom:2.25rem}
  }
</style>
</head>
<body>
  <main class="wrap">
    <header class="marca">
      <span class="nome">Lúcio <b>Adolfo</b></span>
      <span class="regua"></span>
      <span class="oab">Advocacia Criminal</span>
    </header>

    <!--
      autoplay + muted: nenhum navegador inicia video sozinho COM som para
      quem chega pela primeira vez - nem no computador. Iniciar mudo e a
      unica forma de o play ser automatico de verdade.
      O som e religado pelo script abaixo, no primeiro toque em qualquer
      lugar da pagina.
    -->
    <video class="player" controls playsinline autoplay muted preload="auto">
      <source src="../video1.mp4?v=2" type="video/mp4">
      Seu navegador não reproduz vídeo. <a href="../video1.mp4?v=2">Baixe o arquivo</a>.
    </video>

    
    <h1>Agradecimento</h1>

    <a class="btn" href="https://lucioadolfo.com/meus-livros.html">← Voltar ao site</a>
  </main>

<script>
(function () {
  var v = document.querySelector(".player");
  if (!v) return;

  // Nenhum navegador deixa um video comecar sozinho COM som para quem nunca
  // visitou o site - e politica de autoplay, nao ha como contornar. A
  // estrategia abaixo tira o maximo do que a plataforma permite:
  //   1. tenta com som (funciona para quem ja assistiu videos no dominio)
  //   2. se for barrado, volta ao mudo, que sempre e permitido, e o video
  //      comeca na hora do mesmo jeito
  //   3. o primeiro toque em qualquer lugar liga o som
  var tentouComSom = false;

  function tocarMudo() {
    v.muted = true;
    var p = v.play();
    if (p) p.catch(function () {});
  }

  function tentarComSom() {
    if (tentouComSom) return;
    tentouComSom = true;
    v.muted = false;
    v.volume = 1;
    var p = v.play();
    if (!p) { tocarMudo(); return; }
    p.then(function () {
      // Alguns navegadores aceitam o play e pausam logo em seguida.
      setTimeout(function () { if (v.paused) tocarMudo(); }, 120);
    }).catch(function () {
      tocarMudo();
    });
  }

  tentarComSom();
  v.addEventListener("loadeddata", function () { if (v.paused) tocarMudo(); }, { once: true });
  v.addEventListener("canplay", function () { if (v.paused) tocarMudo(); }, { once: true });

  // Primeiro contato com a pagina liga o som - qualquer toque, clique,
  // rolagem ou tecla serve, sem precisar acertar botao nenhum.
  function ligarSom() {
    if (!v.muted) return;
    v.muted = false;
    v.volume = 1;
    if (v.paused) v.play().catch(function () {});
  }
  ["pointerdown", "touchstart", "keydown", "wheel", "scroll"].forEach(function (evento) {
    window.addEventListener(evento, ligarSom, { once: true, passive: true });
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && v.paused) v.play().catch(function () {});
  });
})();
</script>
</body>
</html>
