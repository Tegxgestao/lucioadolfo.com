name: Publicar site na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simular:
        description: "Simular sem enviar (dry-run)"
        type: boolean
        default: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A chave do host e FIXADA no secret HOSTINGER_KNOWN_HOSTS, capturada uma
      # vez com ssh-keyscan. Antes o workflow buscava essa chave pela rede a
      # cada execucao, o que falhava de forma intermitente (1 em 3) e derrubava
      # a publicacao. Fixar remove a dependencia de rede E mantem a verificacao
      # estrita: se o servidor apresentar outra chave, o deploy para.
      - name: Preparar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "${{ secrets.HOSTINGER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # As exclusoes NAO sao opcionais:
      # midia/ guarda os 15 videos, que nao estao no git. Sem essa linha,
      # o --delete apaga todos eles do servidor na primeira publicacao.
      - name: Enviar arquivos
        run: |
          rsync -avz ${{ inputs.simular && '--dry-run' || '' }} --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'midia/' \
            --exclude 'CNAME' \
            --exclude 'README.md' \
            --exclude '.playwright-mcp/' \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }} -i ~/.ssh/deploy -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PATH }}/"
