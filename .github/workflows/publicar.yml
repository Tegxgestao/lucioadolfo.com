name: Publicar site na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simular:
        description: "Simular sem enviar (dry-run)"
        type: boolean
        default: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O ssh-keyscan falha de forma intermitente (visto em 1 de 3 execucoes).
      # Tenta 3 vezes; se ainda assim falhar, segue em frente - o rsync abaixo
      # usa accept-new e resolve a chave do host sozinho.
      - name: Preparar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          for tentativa in 1 2 3; do
            if ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} -H ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "chave do host obtida na tentativa $tentativa"
              break
            fi
            echo "ssh-keyscan falhou (tentativa $tentativa), repetindo em 5s"
            sleep 5
          done

      # As exclusoes NAO sao opcionais:
      # midia/ guarda os 15 videos, que nao estao no git. Sem essa linha,
      # o --delete apaga todos eles do servidor na primeira publicacao.
      - name: Enviar arquivos
        run: |
          rsync -avz ${{ inputs.simular && '--dry-run' || '' }} --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'midia/' \
            --exclude 'CNAME' \
            --exclude 'README.md' \
            --exclude '.playwright-mcp/' \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }} -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PATH }}/"
